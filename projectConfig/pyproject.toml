[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ransomware-detection-system"
version = "0.1.0"
description = "Offline Windows ransomware-like behavior detector"
requires-python = ">=3.11"
dependencies = [
    "joblib==1.6.0",
    "pandas==3.0.5",
    "psutil==7.2.2",
    "scikit-learn==1.9.0",
    "PySide6==6.11.2",
]

[tool.setuptools.packages.find]
include = ["app*", "trainingModel*", "scripts*"]

[tool.setuptools.package-data]
app = ["config/*.json"]

[project.scripts]
ransomware-detector = "app.main:main"
